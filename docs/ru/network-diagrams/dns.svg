  <text x="360.0" y="166" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#19392a" font-weight="700">Временная связь имени с IP</text>
  <path d="M360 185V220" fill="none" stroke="#4d6c58" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="5 5"/>
  <rect x="220" y="221" width="280" height="50" rx="10" fill="#ffffff" stroke="#85a490"/>
  <text x="360.0" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" fill="#19392a" font-weight="700">Новое соединение без имени</text>
