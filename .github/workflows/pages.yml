name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'locales/**', 'overrides/**', 'web/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/pages.yml']
  push:
    branches: [main]
    paths: ['docs/**', 'locales/**', 'overrides/**', 'web/**', 'mkdocs.yml', 'requirements-docs.txt', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Check source language
        run: make check-language
      - name: Build English and Russian documentation
        run: |
          pip install -r requirements-docs.txt
          mkdocs build --strict
      - name: Test and build standalone demo
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build:demo
      - name: Assemble static site
        run: |
          mkdir -p site/demo
          cp -R web/dist-demo/. site/demo/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
