INHERIT: locales/mkdocs.ru.yml
site_name: KeenProxy
site_description: Selective routing for your network
site_url: !ENV [DOCS_SITE_URL, 'https://ordo-systems.github.io/keen-proxy/']
repo_url: https://github.com/ordo-systems/keen-proxy
repo_name: ordo-systems/keen-proxy
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  font: false
  logo: assets/logo.png
  favicon: assets/logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Dark theme
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Light theme
extra_css:
  - assets/keenproxy.css
nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - User guide: user-guide.md
  - Routing and DNS: routing.md
  - How traffic flows: network-flow.md
  - Troubleshooting: troubleshooting.md
  - Browser demo: browser-demo.md
  - Documentation development: development.md
markdown_extensions:
  - admonition
  - attr_list
  - toc:
      permalink: true
  - pymdownx.superfences
