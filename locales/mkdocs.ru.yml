# Documentation language configuration and Russian navigation translations.
plugins:
  - search
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          default: true
          name: English
        - locale: ru
          name: Русский
          nav_translations:
            Overview: Обзор
            Getting started: Начало работы
            User guide: Руководство пользователя
            Routing and DNS: Маршрутизация и DNS
            Troubleshooting: Диагностика и вопросы
            Browser demo: Демо в браузере
            Documentation development: Разработка документации
